<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),U=devicePixelRatio||1,FN='system-ui,Segoe UI,Arial,sans-serif';

let vw,vh,F,FOVV=70,SENS=1;

  for(const k in b){const [bx,by,br]=b[k];if(Math.hypot(x-bx,y-by)<br+12){if(k=='cam')bc=!bc;else if(k=='jump')press.Space=1;if(k!='cam')T[k]=e.pointerId;return}}

cv.addEventListener('pointermove',e=>{if(T.js&&T.js.id==e.pointerId){T.js.x=e.clientX;T.js.y=e.clientY}});
const up=e=>{delete pts[e.pointerId];if(T.js&&T.js.id==e.pointerId)T.js=null;if(T.boost==e.pointerId)T.boost=0;if(T.jump==e.pointerId)T.jump=0;if(T.rl==e.pointerId)T.rl=0;if(T.rr==e.pointerId)T.rr=0};

/* ---------- state (made with ai) ---------- */
const D=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],X=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],N=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return[a[0]/l,a[1]/l,a[2]/l]},A=(a,b,k)=>[a[0]+b[0]*k,a[1]+b[1]*k,a[2]+b[2]*k],SC=(a,k)=>[a[0]*k,a[1]*k,a[2]*k];
const PL=[[0,1,0,0],[0,-1,0,CH],[0,0,1,WD],[0,0,-1,WD],[1,0,0,L],[-1,0,0,L]];
const dpl=(j,P)=>PL[j][0]*P[0]+PL[j][1]*P[1]+PL[j][2]*P[2]+PL[j][3],okp=(j,P)=>j<4||Math.abs(P[2])>GZ+25;
const mk=(team,bot)=>({team,bot,x:0,y:16,z:0,vx:0,vy:0,vz:0,f:[1,0,0],u:[0,1,0],n:[0,1,0],vf:[1,0,0],vu:[0,1,0],pi:0,on:1,bs:60,jumps:0,fl:0,fs:0,rd:0,pend:0,cd:0,wt:0,bo:false,dead:0,boom:0,fr:0,sk:.5,si:0,k:{t:0,s:0,b:0,j:0,r:0}});
const cars=[mk(0,0),mk(0,1),mk(0,1),mk(1,1),mk(1,1),mk(1,1)];cars.forEach((c,n)=>c.si=n);
const spawn=[[-420,0],[-560,-260],[-560,260],[420,0],[560,260],[560,-260]];
let ACT=[0,1,3,4];
const ball={x:0,y:R,z:0,vx:0,vy:0,vz:0};
const pads=[[-560,-330],[-560,330],[560,-330],[560,330],[0,0],[0,-400],[0,400],[-300,0],[300,0]].map(([x,z])=>({x,z,t:0}));
const COL=['#e9edf2','#2f8bff','#e63946','#2ecc71','#f1c40f','#b36bff','#ff8a2b','#2b2f3a'],FL=['#ffd34d','#ff5a36','#4dd2ff','#8dff6a','#d46bff'];
let score=[0,0],time=180,ot=false,state='menu',gt=0,who=0,ct=0,mode='quick',mmr=600,cust={b:0,fl:0};
try{mmr=+localStorage.tk_mmr||600;cust=JSON.parse(localStorage.tk_c)||cust}catch(e){}
FOVV=cust.fov||70;SENS=cust.sens||1;rs();
const sv=()=>{try{localStorage.tk_mmr=mmr;localStorage.tk_c=JSON.stringify(cust)}catch(e){}};
function spawnCar(c,b){const s=spawn[c.si],f=c.team?[-1,0,0]:[1,0,0];Object.assign(c,{x:s[0],y:16,z:s[1],vx:0,vy:0,vz:0,f,u:[0,1,0],n:[0,1,0],vf:f.slice(),vu:[0,1,0],pi:0,on:1,bs:b,dead:0,jumps:0,fl:0})}
function reset(){
  cars.forEach(c=>{spawnCar(c,60);c.pend=0;c.cd=0;c.wt=0;c.fr=0;c.sk=mode=='ranked'?Math.min(1,Math.max(.2,(mmr-400)/900)):.5});
  Object.assign(ball,{x:0,y:R,z:0,vx:0,vy:0,vz:0});pads.forEach(p=>p.t=0);
  cars.forEach((c,n)=>{if(!ACT.includes(n))c.dead=1e9});
  state='count';ct=mode=='free'?.3:3;
}
function startMode(m,sz){mode=m;ACT=m=='free'?[0]:sz==1?[0,3]:sz==3?[0,1,2,3,4,5]:[0,1,3,4];score=[0,0];time=180;ot=false;reset()}
function endGame(){state='end';if(mode=='ranked'){mmr=Math.max(0,mmr+(score[0]>score[1]?25:-20));sv()}}
const PT=[];
function boom(st,t){
  const col=t?['#ff8a2b','#ffd34d','#fff']:['#2f8bff','#7fd0ff','#fff'],x=ball.x,y=ball.y,z=ball.z;
  const add=(n,sp,gv,life,sz,cs,px,py,pz)=>{for(let i=0;i<n;i++){const a=Math.random()*TAU,b=Math.acos(2*Math.random()-1),s=sp*(.4+Math.random()*.6);PT.push({x:px,y:py,z:pz,vx:Math.sin(b)*Math.cos(a)*s,vy:Math.cos(b)*s,vz:Math.sin(b)*Math.sin(a)*s,g:gv,l:life,m:life,c:cs[(Math.random()*cs.length)|0],s:sz})}};
  if(st==0)add(130,520,500,1.6,5,col,x,y,z);
  if(st==1)add(240,420,300,3,4,['#ff4d6d','#ffd34d','#4dd2ff','#8dff6a','#d46bff'],x,y+40,z);
  if(st==2)for(let k=0;k<5;k++)setTimeout(()=>add(90,430,250,1.6,4,[col[k%3],'#fff'],x*.5+(Math.random()-.5)*500,180+Math.random()*180,z+(Math.random()-.5)*400),k*350);
  if(st==3)for(let i=0;i<180;i++){const a=i/180*TAU;PT.push({x,y:30,z,vx:Math.cos(a)*900,vy:0,vz:Math.sin(a)*900,g:0,l:1.2,m:1.2,c:col[i%3],s:6})}
}
let AC=null;function snd(f,d,ty,v){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume();const o=AC.createOscillator(),n=AC.createGain(),t=AC.currentTime;o.type=ty;o.frequency.value=f;n.gain.setValueAtTime(v,t);n.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(n);n.connect(AC.destination);o.start();o.stop(t+d)}catch(e){}}
const demo=v=>{v.dead=3;v.boom=.7;v.vx=v.vy=v.vz=0;snd(70,.6,'sawtooth',.15)};
const sv3=c=>Math.hypot(c.vx,c.vy,c.vz);

function drive(c,dt){
  if(c.dead>0){c.dead-=dt;c.boom-=dt;if(c.dead<=0)spawnCar(c,33);return}
  const i=c.k,cs=Math.cos,sn=Math.sin;let P=[c.x,c.y,c.z],V=[c.vx,c.vy,c.vz],f=c.f,u=c.u,r=X(f,u);
  c.fr=Math.max(0,c.fr-dt);c.fl=Math.max(0,c.fl-dt);
  if(i.j){
    if(c.on){V=A(V,c.n,360);c.on=0;c.jumps=1;c.pend=.14;if(c.si==0)snd(320,.1,'square',.04)}
    else if(c.jumps==1){c.jumps=2;
      if(i.t||i.s){c.fl=.5;c.fs=Math.sign(i.t);c.rd=Math.sign(i.s);V=A(A(V,f,520*i.t),r,520*i.s);V[1]=Math.max(V[1],140)}
      else V=A(V,u,240);
    }
  }
  const bo=!!i.b&&c.bs>0;c.bo=bo;
  if(bo){V=A(V,f,1200*dt);c.bs=Math.max(0,c.bs-33*dt)}
  const mx=(bo?1000:700)*(c.bot?.8+.3*c.sk:1);
  const land=(j,d)=>{c.pi=j;c.n=PL[j].slice(0,3);P=A(P,c.n,16-d);V=A(V,c.n,-D(V,c.n));let t=A(f,c.n,-D(f,c.n));if(Math.hypot(t[0],t[1],t[2])<.3)t=A(u,c.n,-D(u,c.n));f=N(t)};
  if(c.on){
    const n=c.n;f=N(A(f,n,-D(f,n)));u=n;r=X(f,u);
    const sp=D(V,f);V=A(V,f,i.t*720*dt);V=A(V,r,-D(V,r)*Math.min(1,9*dt));V=A(V,n,-D(V,n));
    if(!i.t&&!bo)V=SC(V,Math.max(0,1-1.3*dt));
    const th=i.s*3*(c.si?1:SENS)*Math.max(-1,Math.min(1,sp/160))*dt;f=N(A(SC(f,cs(th)),r,sn(th)));
    const hv=Math.hypot(V[0],V[1],V[2]);if(hv>mx)V=SC(V,Math.max(mx/hv,1-6*dt));
    P=A(P,V,dt);P=A(P,n,16-dpl(c.pi,P));
    for(let j=0;j<6;j++)if(j!=c.pi&&okp(j,P)){const d=dpl(j,P);if(d<24&&D(V,PL[j])<-5){const nj=PL[j].slice(0,3),no=c.n,rot=w=>{const q=D(w,nj);return A(A(w,nj,-q),no,-q)};V=rot(V);f=N(rot(f));c.pi=j;c.n=nj;P=A(P,nj,16-d);break}}
    u=c.n;c.wt=c.pi?c.wt+dt:0;
    if(c.pi&&Math.hypot(V[0],V[1],V[2])<40){c.on=0;c.jumps=1}
  }else{
    V[1]-=900*dt;
    let pa=0,ra=0;const ya=i.s*3*(c.si?1:SENS)*dt;
    if(c.fl>0){const w=TAU/.5*dt;pa=-c.fs*w;ra=c.fs?0:c.rd*w}else{pa=-i.t*2.4*(c.si?1:SENS)*dt;ra=i.r*4*(c.si?1:SENS)*dt}
    if(pa){const a=f,b=u;f=A(SC(a,cs(pa)),b,sn(pa));u=A(SC(b,cs(pa)),a,-sn(pa))}
    if(ya){r=X(f,u);f=A(SC(f,cs(ya)),r,sn(ya))}
    if(ra){r=X(f,u);u=A(SC(u,cs(ra)),r,-sn(ra))}
    f=N(f);u=N(A(u,f,-D(u,f)));P=A(P,V,dt);
    for(let j=0;j<6;j++)if(okp(j,P)){const d=dpl(j,P);if(d<=16&&D(V,PL[j])<0){c.on=1;c.jumps=0;c.fl=0;land(j,d);u=c.n;break}}
  }
  const mxx=L-16;P[0]=Math.max(-mxx,Math.min(mxx,P[0]));P[2]=Math.max(-WD+16,Math.min(WD-16,P[2]));P[1]=Math.max(16,Math.min(CH-16,P[1]));
  if(Math.abs(P[2])<GZ+10&&Math.abs(P[0])>L-40&&c.pi<4){const s=Math.sign(P[0]);P[0]=s*(L-40);V[0]=-s*Math.abs(V[0])*.3}
  c.x=P[0];c.y=P[1];c.z=P[2];c.vx=V[0];c.vy=V[1];c.vz=V[2];c.f=f;c.u=u;
  const k=Math.min(1,(c.on?7:60)*dt);c.vf=N(A(SC(c.vf,1-k),f,k));c.vu=N(A(SC(c.vu,1-k),u,k));
}

function ai(c,dt){
  const i=c.k;i.t=0;i.s=0;i.b=0;i.j=0;i.r=0;
  const gx=c.team?-L:L,own=c.team?L:-L,mates=cars.filter(o=>o.team==c.team&&o.dead<=0);
  const dist=o=>Math.hypot(o.x-ball.x,o.z-ball.z),near=mates.reduce((a,b)=>dist(a)<=dist(b)?a:b,c);
  const bd=dist(c),atk=near===c||bd<320,fl=c.on&&c.pi==0;let tx,tz;
  if(atk){
    const bx=ball.x+ball.vx*.25,bz=ball.z+ball.vz*.25,ax=gx-bx,az=-bz,al=Math.hypot(ax,az)||1;
    const behind=((c.x-bx)*ax+(c.z-bz)*az)<0;
    if(behind&&bd<480){tx=bx;tz=bz}else{tx=bx-ax/al*90;tz=bz-az/al*90}
  }else{
    tx=own*.7;tz=ball.z*.5;
    if(c.bs<25){const p=pads.reduce((a,b)=>(b.t<=0&&(a.t>0||Math.hypot(b.x-c.x,b.z-c.z)<Math.hypot(a.x-c.x,a.z-c.z)))?b:a);tx=p.x;tz=p.z}
  }
  const ha=Math.atan2(c.f[2],c.f[0]);let da=Math.atan2(tz-c.z,tx-c.x)-ha;da=Math.atan2(Math.sin(da),Math.cos(da));
  const td=Math.hypot(tx-c.x,tz-c.z);
  i.t=(td>60||atk)?1:0;i.s=Math.max(-1,Math.min(1,da*3));
  if(Math.abs(da)<.25&&td>420&&fl&&Math.random()<.4+.6*c.sk)i.b=1;
  c.cd-=dt;
  let ba=Math.atan2(ball.z-c.z,ball.x-c.x)-ha;ba=Math.atan2(Math.sin(ba),Math.cos(ba));
  if(fl&&c.cd<=0&&near===c&&bd<210&&Math.abs(ba)<.5&&ball.y<130){i.j=1;c.cd=1.4}
  if(c.on&&c.pi&&c.wt>.7)i.j=1;
  if(c.pend>0){c.pend-=dt;if(c.pend<=0&&c.jumps==1&&!c.on){i.j=1;i.t=1;i.s=0}}
}

function hitBall(c){
  if(c.dead>0)return;
  const dx=ball.x-c.x,dy=ball.y-c.y,dz=ball.z-c.z,d=Math.hypot(dx,dy,dz),mr=R+36;
  if(d>=mr||d==0)return;
  const nx=dx/d,ny=dy/d,nz=dz/d;
  ball.x=c.x+nx*mr;ball.y=c.y+ny*mr;ball.z=c.z+nz*mr;
  const rv=(ball.vx-c.vx)*nx+(ball.vy-c.vy)*ny+(ball.vz-c.vz)*nz;
  if(rv<0){const j=-rv*1.5+70+(c.fl>0?460:0);ball.vx+=nx*j;ball.vy+=ny*j+60;ball.vz+=nz*j;if(j>250)snd(110+Math.min(200,j/6),.12,'triangle',.12)}
  if(!c.on&&D([nx,ny,nz],c.u)<-.55){c.jumps=1;c.fl=0;c.fr=1}
  const s=Math.hypot(ball.vx,ball.vy,ball.vz);if(s>1500){const k=1500/s;ball.vx*=k;ball.vy*=k;ball.vz*=k}
}

function stepBall(dt){
  ball.vy-=700*dt;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.z+=ball.vz*dt;
  const k=Math.pow(ball.y<=R+1?.88:.97,dt);ball.vx*=k;ball.vz*=k;
  if(ball.y<R){ball.y=R;ball.vy=Math.abs(ball.vy)>40?Math.abs(ball.vy)*.65:0}
  if(ball.y>CH-R){ball.y=CH-R;ball.vy=-Math.abs(ball.vy)*.6}
  if(Math.abs(ball.x)>L){
    ball.z=Math.max(-GZ+R,Math.min(GZ-R,ball.z));ball.y=Math.min(ball.y,GH-R);
    const e=L+GD-R;if(ball.x>e){ball.x=e;ball.vx=-Math.abs(ball.vx)*.4}if(ball.x<-e){ball.x=-e;ball.vx=Math.abs(ball.vx)*.4}
  }else{
    const mouth=Math.abs(ball.z)<GZ-R&&ball.y<GH-R;
    if(!mouth){if(ball.x>L-R){ball.x=L-R;ball.vx=-Math.abs(ball.vx)*.7}if(ball.x<-L+R){ball.x=-L+R;ball.vx=Math.abs(ball.vx)*.7}}
  }
  if(Math.abs(ball.x)<=L||true){
    if(ball.z>WD-R&&Math.abs(ball.x)<=L){ball.z=WD-R;ball.vz=-Math.abs(ball.vz)*.7}
    if(ball.z<-WD+R&&Math.abs(ball.x)<=L){ball.z=-WD+R;ball.vz=Math.abs(ball.vz)*.7}
  }
}

const CVR=100;
function coveBall(){
  const C=CVR;
  let u=WD-Math.abs(ball.z);
  if(Math.abs(ball.x)<=L&&u<C&&ball.y<C){
    const du=C-u,dy=C-ball.y,dd=Math.hypot(du,dy);
    if(dd>C-R){const nx=du/dd,ny=dy/dd,pen=dd-(C-R),sz=-Math.sign(ball.z);
      ball.z+=sz*nx*pen;ball.y+=ny*pen;
      const vn=ball.vz*sz*nx+ball.vy*ny;if(vn<0){const k=-1.6*vn;ball.vz+=sz*nx*k;ball.vy+=ny*k}}
  }
  u=L-Math.abs(ball.x);
  if(u>=0&&u<C&&Math.abs(ball.z)>GZ&&ball.y<C){
    const du=C-u,dy=C-ball.y,dd=Math.hypot(du,dy);
    if(dd>C-R){const nx=du/dd,ny=dy/dd,pen=dd-(C-R),sx=-Math.sign(ball.x);
      ball.x+=sx*nx*pen;ball.y+=ny*pen;
      const vn=ball.vx*sx*nx+ball.vy*ny;if(vn<0){const k=-1.6*vn;ball.vx+=sx*nx*k;ball.vy+=ny*k}}
  }
}
function coves(){
  const C=CVR,n=8;
  for(let i=0;i<n;i++){
    const a0=i/n*Math.PI/2,a1=(i+1)/n*Math.PI/2,u0=C*(1-Math.sin(a0)),y0=C*(1-Math.cos(a0)),u1=C*(1-Math.sin(a1)),y1=C*(1-Math.cos(a1)),sh=80+i*16;
    const col='rgb('+(sh*.35|0)+','+(sh*.95|0)+','+(sh*.55|0)+')';
    for(const s of[-1,1]){
      poly([[-L,y0,s*(WD-u0)],[L,y0,s*(WD-u0)],[L,y1,s*(WD-u1)],[-L,y1,s*(WD-u1)]],col);
      for(const z of[[-WD,-GZ],[GZ,WD]])poly([[s*(L-u0),y0,z[0]],[s*(L-u0),y0,z[1]],[s*(L-u1),y1,z[1]],[s*(L-u1),y1,z[0]]],col);
    }
  }
}

      else{g.fillStyle='#e8eef6';g.font='600 18px '+FN;g.textAlign='left';g.fillText('Field of view',vw/2-230,137);g.fillText('Steering sensitivity',vw/2-230,207);
        g.textAlign='center';g.font='700 20px '+FN;g.fillText(FOVV+'°',vw/2+150,137);g.fillText(SENS.toFixed(1)+'x',vw/2+150,207);sB().forEach(btnR)}
    }
    return;
  }
  g.textAlign='center';g.fillStyle='rgba(6,12,22,.62)';g.fillRect(vw/2-130,8,260,54);
  g.font='800 34px '+FN;g.fillStyle='#6bb4ff';g.fillText(score[0],vw/2-92,46);g.fillStyle='#ffa45e';g.fillText(score[1],vw/2+92,46);
  g.fillStyle='#fff';g.font='700 24px '+FN;const t=Math.ceil(time);g.fillText(mode=='free'?'Free':ot?'OT':Math.floor(t/60)+':'+String(t%60).padStart(2,'0'),vw/2,42);
  const c=cars[0],b=c.bs,sp=sv3(c);
  g.fillStyle='rgba(6,12,22,.62)';g.fillRect(12,12,200,50);g.fillStyle='#ffb02e';g.fillRect(16,16,b*1.92,20);
  g.fillStyle='#fff';g.font='700 13px '+FN;g.textAlign='left';g.fillText('Boost '+Math.round(b),22,31);g.fillText('Speed '+Math.round(sp/10)+'  Ball cam '+(bc?'on':'off'),22,54);g.textAlign='center';
  if(c.dead>0)banner('Demolished','','#ff6a4d',1);
  if(touchUI){
    const j=T.js;if(j){g.fillStyle='rgba(255,255,255,.12)';g.beginPath();g.arc(j.x0,j.y0,55,0,TAU);g.fill();g.fillStyle='rgba(255,255,255,.35)';g.beginPath();g.arc(j.x0+Math.max(-55,Math.min(55,j.x-j.x0)),j.y0+Math.max(-55,Math.min(55,j.y-j.y0)),26,0,TAU);g.fill()}
    else{g.fillStyle='rgba(255,255,255,.08)';g.beginPath();g.arc(100,vh-100,55,0,TAU);g.fill();g.fillStyle='#fff';g.font='600 12px '+FN;g.fillText('Drive',100,vh-96)}
    const B=btn(),nm={boost:'Boost',jump:'Jump',cam:'Cam',rl:'Q',rr:'E'};
    for(const k in B){const[x,y,r]=B[k],on=T[k];g.fillStyle=on?'rgba(255,176,46,.65)':'rgba(255,255,255,.18)';g.beginPath();g.arc(x,y,r,0,TAU);g.fill();g.strokeStyle='rgba(255,255,255,.5)';g.lineWidth=2;g.stroke();g.fillStyle='#fff';g.font='700 '+(r>40?15:12)+'px '+FN;g.fillText(nm[k],x,y+5)}
  }
  if(c.fr>0){g.fillStyle='#ffe95a';g.font='800 28px '+FN;g.fillText('flip resetjd',vw/2,vh*.3)}
  if(state=='goal')banner('User Scored!',(who?'Orange':'Blue')+' scored lol','#ffd34d',1);
  else if(state=='count'&&mode!='free')banner(String(Math.ceil(ct)),'','#fff',1);
  else if(state=='end')banner(score[0]>score[1]?'Blue wins':'Orange wins',score[0]+' - '+score[1]+(mode=='ranked'?'\nRank points: '+mmr:'')+'\nTap or press Enter for the menu',score[0]>score[1]?'#6bb4ff':'#ffa45e');
}

let last=0;
function loop(ts){
  const dt=Math.min(1/30,(ts-last)/1000||0);last=ts;
  update(dt);draw();bsTick();for(const k in press)delete press[k];requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script></body></html>
