let AC=null;function snd(f,d,ty,v){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume();const o=AC.createOscillator(),n=AC.createGain(),t=AC.currentTime;o.type=ty;o.frequency.value=f;n.gain.setValueAtTime(Math.max(.0001,v*VOL),t);n.gain.exponentialRampToValueAtTime(.00005,t+d);o.connect(n);n.connect(AC.destination);o.start();o.stop(t+d)}catch(e){}}

const sv3=c=>Math.hypot(c.vx,c.vy,c.vz);

const JV=540,CG=780,BA=1350,NM=900,BM=1400,ACC=950,BG=430,CVR=170;
function arenaN(P,open){
  const mx=open?1e5:L-CVR;
  const px=Math.max(-mx,Math.min(mx,P[0])),py=Math.max(CVR,Math.min(CH-CVR,P[1])),pz=Math.max(-(WD-CVR),Math.min(WD-CVR,P[2]));

}
function drive(c,dt){
  if(c.dead>0){c.dead-=dt;c.boom-=dt;if(c.dead<=0)spawnCar(c,33);return}
  const i=c.k,cs=Math.cos,sn=Math.sin,W=[0,1,0],hy=v=>Math.hypot(v[0],v[1],v[2]);

    else if(c.jumps==1){c.jumps=2;

      else V=A(V,u,320);
    }
  }
  const bo=!!i.b&&c.bs>0;c.bo=bo;
  if(bo){V=A(V,f,BA*dt);c.bs=Math.max(0,c.bs-33*dt)}
  const mx=(bo?BM:NM)*(c.bot?.8+.3*c.sk:1);
  const stick=(s)=>{const nn=s.n;P=A(s.p,s.dir,CVR-16);V=A(V,nn,-D(V,nn));let t=A(f,nn,-D(f,nn));if(hy(t)<.3)t=A(u,nn,-D(u,nn));f=N(t);c.n=nn;u=nn};

    const sp=D(V,f);V=A(V,f,i.t*ACC*dt);V=A(V,r,-D(V,r)*Math.min(1,9*dt));V=A(V,n,-D(V,n));
    if(!i.t&&!bo)V=SC(V,Math.max(0,1-1.3*dt));
    const th=i.s*2.3*(c.si?1:SENS)*Math.max(-1,Math.min(1,sp/160))*dt;f=N(A(SC(f,cs(th)),r,sn(th)));
    let hv=hy(V);if(hv>mx){V=SC(V,Math.max(mx/hv,1-6*dt));hv=hy(V)}
    P=A(P,V,dt);

    if(s){stick(s);const h2=hy(V);if(h2>1e-3)V=SC(V,hv/h2)}
    c.pi=c.n[1]>.8?0:1;c.wt=c.pi?c.wt+dt:0;
    c.ct=c.n[1]<-.7?(c.ct||0)+dt:0;if(c.ct>1){c.on=0;c.jumps=1;c.ct=0;V=A(V,c.n,60)}
    if(c.pi&&hv<40){c.on=0;c.jumps=1}
  }else{
    V[1]-=CG*dt;
    let pa=0,ra=0;const ya=i.s*2.4*(c.si?1:SENS)*dt;
    if(c.fl>0){const w=TAU/.5*dt;pa=-c.fs*w;ra=c.fs?0:c.rd*w}else{pa=-i.t*3.2*(c.si?1:SENS)*dt;c.rt=(c.rt||0)+(i.r*3.2-(c.rt||0))*Math.min(1,5*dt);c.rv=(c.rv||0)+Math.max(-9*dt,Math.min(9*dt,c.rt-(c.rv||0)));ra=c.rv*(c.si?1:SENS)*dt}

  }

function ai(c,dt){
  const i=c.k;i.t=0;i.s=0;i.b=0;i.j=0;i.r=0;
  const gx=c.team?-L:L,own=c.team?L:-L,mates=cars.filter(o=>o.team==c.team&&o.dead<=0);

  if(atk){
    const bx=ball.x+ball.vx*.25,bz=ball.z+ball.vz*.25,ax=gx-bx,az=-bz,al=Math.hypot(ax,az)||1;

  let ba=Math.atan2(ball.z-c.z,ball.x-c.x)-ha;ba=Math.atan2(Math.sin(ba),Math.cos(ba));

function hitBall(c){
  if(c.dead>0)return;
  const dx=ball.x-c.x,dy=ball.y-c.y,dz=ball.z-c.z,d=Math.hypot(dx,dy,dz),mr=R+42;

  const nx=dx/d,ny=dy/d,nz=dz/d;
  ball.x=c.x+nx*mr;ball.y=c.y+ny*mr;ball.z=c.z+nz*mr;
  const rv=(ball.vx-c.vx)*nx+(ball.vy-c.vy)*ny+(ball.vz-c.vz)*nz;
  if(rv<0){const j=-rv*1.5+30+(c.fl>0?460:0);ball.vx+=nx*j;ball.vy+=ny*j+10;ball.vz+=nz*j;if(j>110)ballHit(j)}
  if(!c.on&&D([nx,ny,nz],c.u)<-.55){c.jumps=1;c.fl=0;c.fr=1}
  const s=Math.hypot(ball.vx,ball.vy,ball.vz);if(s>2400){const k=2400/s;ball.vx*=k;ball.vy*=k;ball.vz*=k}
}

function stepBall(dt){
  ball.vy-=BG*dt;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.z+=ball.vz*dt;
  const k=Math.pow(ball.y<=R+1?.88:.97,dt);ball.vx*=k;ball.vz*=k;
  if(ball.y<R){ball.y=R;ball.vy=Math.abs(ball.vy)>110?Math.abs(ball.vy)*.36:0}
  if(ball.y>CH-R){ball.y=CH-R;ball.vy=-Math.abs(ball.vy)*.4}
  if(Math.abs(ball.x)>L){
    ball.z=Math.max(-GZ+R,Math.min(GZ-R,ball.z));ball.y=Math.min(ball.y,GH-R);
    const e=L+GD-R;if(ball.x>e){ball.x=e;ball.vx=-Math.abs(ball.vx)*.4}if(ball.x<-e){ball.x=-e;ball.vx=Math.abs(ball.vx)*.4}
  }else{
    const mouth=Math.abs(ball.z)<GZ-R&&ball.y<GH-R;
    if(!mouth){if(ball.x>L-R){ball.x=L-R;ball.vx=-Math.abs(ball.vx)*.7}if(ball.x<-L+R){ball.x=-L+R;ball.vx=Math.abs(ball.vx)*.7}}

  const pc=cars[0],m=tc(pc.x,pc.y+70,pc.z);if(m[2]>1&&!inMenu()){const s=S(m);g.fillStyle='#fff';g.beginPath();g.moveTo(s[0],s[1]);g.lineTo(s[0]-9,s[1]-16);g.lineTo(s[0]+9,s[1]-16);g.fill()}
  PT.forEach(p=>{const q=tc(p.x,p.y,p.z);if(q[2]<1)return;const s=S(q);g.globalAlpha=Math.max(0,p.l/p.m);g.fillStyle=p.c;g.beginPath();g.arc(s[0],s[1],Math.max(1,p.s/q[2]*F),0,TAU);g.fill()});g.globalAlpha=1;
  hud();
  if(state=='paused'||net.ovl)drawPause();
  drawToast();
  if(SHOWFPS){g.textAlign='right';g.fillStyle='#fff';g.font='700 12px '+FN;g.fillText('FPS '+Math.round(FPSV),vw-12,72)}
}

function banner(t,sub,col,small){
  g.fillStyle=small?'rgba(6,12,22,0)':'rgba(6,12,22,.72)';g.fillRect(0,0,vw,vh);g.textAlign='center';
  g.fillStyle=col;g.font='800 '+Math.min(small?110:76,vw/(small?5:8))+'px '+FN;g.fillText(t,vw/2,vh/2-(sub?10:-30));
  g.fillStyle='#e8eef6';g.font='500 '+Math.min(19,vw/24)+'px '+FN;
  if(sub)sub.split('\n').forEach((l,n)=>g.fillText(l,vw/2,vh/2+30+n*28));
}
function btnR(b,foc){
  g.fillStyle=b.c||(b.f||b.k?'rgba(255,255,255,.15)':'rgba(255,255,255,.05)');g.fillRect(b.x,b.y,b.w,b.h);
  g.strokeStyle=b.sel?'#fff':'rgba(255,255,255,.4)';g.lineWidth=b.sel?4:1.5;g.strokeRect(b.x,b.y,b.w,b.h);if(foc){g.strokeStyle='#ffd34d';g.lineWidth=4;g.strokeRect(b.x-4,b.y-4,b.w+8,b.h+8)}
  if(b.chip){g.fillStyle=b.chip;g.fillRect(b.x+8,b.y+b.h/2-8,16,16)}
  if(b.i){g.fillStyle='#fff';g.textAlign='left';g.font='22px '+FN;g.fillText(b.i,b.x+14,b.y+b.h/2+8)}
  if(b.t){g.fillStyle=(b.f||b.k)&&!b.dis?'#fff':'#7d8aa0';g.font='700 '+(b.fs||16)+'px '+FN;g.textAlign='center';g.fillText(b.t,b.x+b.w/2+(b.i?14:b.chip?10:0),b.y+b.h/2+6)}
  if(b.lock){g.fillStyle='rgba(8,12,20,.62)';g.fillRect(b.x,b.y,b.w,b.h);g.fillStyle='#fff';g.font='15px '+FN;g.textAlign='center';g.fillText('🔒',b.t?b.x+b.w-16:b.x+b.w/2,b.y+b.h/2+6)}
}
function hud(){
  if(state=='layout'){drawLayout();return}
  if(inMenu()){
    if(LEFTS.includes(state)){
      const gr=g.createLinearGradient(0,0,360,0);gr.addColorStop(0,'rgba(6,12,22,.92)');gr.addColorStop(1,'rgba(6,12,22,0)');
      g.fillStyle=gr;g.fillRect(0,0,360,vh);
      g.textAlign='left';g.fillStyle='#6bb4ff';g.font='800 30px '+FN;g.fillText('Pixel League',30,54);
      menuB().forEach((b,n)=>btnR(b,n==GP.fi&&GP.on));drawProfile();g.fillStyle='#9fb0c8';g.font='500 12px '+FN;g.textAlign='left';
      g.fillText('Keys 1-6 also work. C ball cam, Q/E air roll, Esc pause',30,vh-16);
    }else{
      if(state=='garage'){const gr=g.createLinearGradient(0,0,vw*.7,0);gr.addColorStop(0,'rgba(6,12,22,.92)');gr.addColorStop(.75,'rgba(6,12,22,.88)');gr.addColorStop(1,'rgba(6,12,22,0)');g.fillStyle=gr;g.fillRect(0,0,vw*.7,vh)}else{g.fillStyle='rgba(6,12,22,.82)';g.fillRect(0,0,vw,vh)}g.textAlign='center';
      if(state=='garage')drawGarage();
      else if(state=='pass')drawPass();
      else drawSettings();
    }
    return;
  }
  g.textAlign='center';g.fillStyle='rgba(6,12,22,.62)';g.fillRect(vw/2-130,8,260,54);
  g.font='800 34px '+FN;g.fillStyle='#6bb4ff';g.fillText(score[0],vw/2-92,46);g.fillStyle='#ffa45e';g.fillText(score[1],vw/2+92,46);
  g.fillStyle='#fff';g.font='700 24px '+FN;const t=Math.ceil(time);g.fillText(mode=='free'?'Free':ot?'OT':Math.floor(t/60)+':'+String(t%60).padStart(2,'0'),vw/2,42);
  const c=cars[0],b=c.bs,sp=sv3(c);
  g.fillStyle='rgba(6,12,22,.62)';g.fillRect(12,12,200,50);g.fillStyle='#ffb02e';g.fillRect(16,16,b*1.92,20);
  g.fillStyle='#fff';g.font='700 13px '+FN;g.textAlign='left';g.fillText('Boost '+Math.round(b),22,31);g.fillText('Speed '+Math.round(sp/10)+'  Ball cam '+(bc?'on':'off'),22,54);g.textAlign='center';
  if(c.dead>0)banner('Demolished','','#ff6a4d',1);
  if(state=='play'||state=='count'||state=='goal'){g.fillStyle='rgba(6,12,22,.55)';g.beginPath();g.arc(vw-30,30,20,0,TAU);g.fill();g.fillStyle='#fff';g.font='700 20px '+FN;g.textAlign='center';g.fillText('☰',vw-30,37)}
  if(touchUI){
    const j=T.js,jb=lay('js');
    g.fillStyle=j?'rgba(255,255,255,.12)':'rgba(255,255,255,.08)';g.beginPath();g.arc(jb[0],jb[1],jb[2],0,TAU);g.fill();
    if(j){const dx=j.x-jb[0],dy=j.y-jb[1],k=Math.min(1,jb[2]/(Math.hypot(dx,dy)||1));g.fillStyle='rgba(255,255,255,.35)';g.beginPath();g.arc(jb[0]+dx*k,jb[1]+dy*k,jb[2]*.47,0,TAU);g.fill()}
    else{g.fillStyle='#fff';g.font='600 12px '+FN;g.textAlign='center';g.fillText('Drive',jb[0],jb[1]+4)}
    const B=btn(),nm={boost:'Boost',jump:'Jump',cam:'Cam',rl:'Q',rr:'E'};
    for(const k in B){const[x,y,r]=B[k],on=T[k];g.fillStyle=on?'rgba(255,176,46,.65)':'rgba(255,255,255,.18)';g.beginPath();g.arc(x,y,r,0,TAU);g.fill();g.strokeStyle='rgba(255,255,255,.5)';g.lineWidth=2;g.stroke();g.fillStyle='#fff';g.font='700 '+(r>40?15:12)+'px '+FN;g.fillText(nm[k],x,y+5)}
  }
  if(state=='goal')banner('Goal!',(who?'Orange':'Blue')+' scores','#ffd34d',1);
  else if(state=='count'&&mode!='free')banner(String(Math.ceil(ct)),'','#fff',1);
  else if(state=='end')banner(score[0]>score[1]?'Blue wins':'Orange wins',score[0]+' - '+score[1]+(mode=='ranked'?'\nRank points: '+mmr:'')+(REWARD?'\n+'+REWARD.xp+' Pixie XP   +'+REWARD.co+' coins':'')+'\nTap or press Enter for the menu',score[0]>score[1]?'#6bb4ff':'#ffa45e');
}

let last=0;
function loop(ts){
  const raw=(ts-last)/1000;if(raw>0)FPSV=FPSV*.92+(1/raw)*.08;const dt=Math.min(1/30,raw||0);last=ts;
  if(inMenu())updPT(dt);
  if(!FIXED){FIXED=true;fixSel()}
  OPEN.t=Math.max(0,OPEN.t-dt);TOAST.u=Math.max(0,TOAST.u-dt);
  update(dt);draw();engineTick(dt);netTick(dt);
  {const a=document.getElementById('nmIn');if(a&&(state!='profile'||ptab2!='name'))a.remove();const b=document.getElementById('txIn');if(b&&state!='online')b.remove()}for(const k in press)delete press[k];requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script></body></html>
